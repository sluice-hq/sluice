spring.datasource.url=${SLUICE_DB_URL:jdbc:postgresql://localhost:5432/sluice?options=-c%20TimeZone=UTC}
spring.datasource.username=${SLUICE_DB_USERNAME:sluice}
spring.datasource.password=${SLUICE_DB_PASSWORD:sluice_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.url=${SLUICE_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${SLUICE_FLYWAY_USERNAME:${spring.datasource.username}}
spring.flyway.password=${SLUICE_FLYWAY_PASSWORD:${spring.datasource.password}}

# Azure Blob Storage (Azurite default credentials)
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:assets}
azure.storage.configure-cors=${AZURE_STORAGE_CONFIGURE_CORS:true}
azure.storage.cors.allowed-origins=${SLUICE_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Local defaults make the existing development stack usable. Production supplies these values as secrets.
sluice.security.jwt.secret=${SLUICE_JWT_SECRET:development-only-jwt-secret-must-be-replaced-before-production-2026}
sluice.cors.allowed-origins=${SLUICE_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# RabbitMQ Retry Configuration
spring.rabbitmq.publisher-confirm-type=correlated
sluice.outbox.publisher-confirm-timeout=${SLUICE_OUTBOX_PUBLISHER_CONFIRM_TIMEOUT:5s}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=2000
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.retry.multiplier=2.0

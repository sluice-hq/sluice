spring.config.activate.on-profile=production

# Azure Container Apps injects these settings from Key Vault-backed secrets.
spring.datasource.url=${SLUICE_DB_URL}
spring.datasource.username=${SLUICE_DB_USERNAME}
spring.datasource.password=${SLUICE_DB_PASSWORD}
spring.flyway.url=${SLUICE_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${SLUICE_FLYWAY_USERNAME:${spring.datasource.username}}
spring.flyway.password=${SLUICE_FLYWAY_PASSWORD:${spring.datasource.password}}
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME}
azure.storage.configure-cors=false
sluice.security.jwt.secret=${SLUICE_JWT_SECRET}
sluice.cors.allowed-origins=${SLUICE_CORS_ALLOWED_ORIGINS}

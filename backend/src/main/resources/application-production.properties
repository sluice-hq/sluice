spring.config.activate.on-profile=production

# Azure Container Apps injects these settings from Key Vault-backed secrets.
spring.datasource.url=${SLUICE_DB_URL}
spring.datasource.username=${SLUICE_DB_USERNAME}
spring.datasource.password=${SLUICE_DB_PASSWORD}
spring.flyway.url=${SLUICE_FLYWAY_URL:${spring.datasource.url}}
spring.flyway.user=${SLUICE_FLYWAY_USERNAME:${spring.datasource.username}}
spring.flyway.password=${SLUICE_FLYWAY_PASSWORD:${spring.datasource.password}}
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME}
azure.storage.configure-cors=false
sluice.security.jwt.secret=${SLUICE_JWT_SECRET}
sluice.cors.allowed-origins=${SLUICE_CORS_ALLOWED_ORIGINS}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
sluice.actuator.public-prometheus=${SLUICE_ACTUATOR_PUBLIC_PROMETHEUS:false}
sluice.media.max-upload-bytes=${SLUICE_MEDIA_MAX_UPLOAD_BYTES:50000000}
spring.servlet.multipart.max-file-size=${SLUICE_MEDIA_MAX_UPLOAD_BYTES:50000000}
spring.servlet.multipart.max-request-size=${SLUICE_MEDIA_MAX_REQUEST_BYTES:51000000}
sluice.media.max-filename-length=${SLUICE_MEDIA_MAX_FILENAME_LENGTH:255}
sluice.media.allowed-content-types=${SLUICE_MEDIA_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/gif,application/pdf,video/mp4}
sluice.governance.provider=${SLUICE_GOVERNANCE_PROVIDER:azure}
sluice.governance.azure.endpoint=${AZURE_CONTENT_SAFETY_ENDPOINT:}
sluice.governance.azure.api-key=${AZURE_CONTENT_SAFETY_API_KEY:}
sluice.governance.azure.api-version=${AZURE_CONTENT_SAFETY_API_VERSION:2024-09-01}
sluice.governance.azure.timeout-millis=${AZURE_CONTENT_SAFETY_TIMEOUT_MILLIS:5000}

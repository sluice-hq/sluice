name: Publish Azure release images

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-demo-images
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    name: Publish ${{ matrix.image }} image
    environment: azure-demo-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: sluice-api
            dockerfile: backend/Dockerfile
            target: api
          - image: sluice-worker
            dockerfile: backend/Dockerfile
            target: worker
          - image: sluice-dashboard
            dockerfile: frontend/Dockerfile
            target: runtime
    env:
      REGISTRY: ${{ vars.AZURE_ACR_NAME }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Require passing CI for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&status=success" |
            jq -e 'any(.workflow_runs[]; .head_branch == "main" and .conclusion == "success")' >/dev/null
          gh api "repos/$GITHUB_REPOSITORY/environments/azure-demo-publish" |
            jq -e 'any(.protection_rules[]; .type == "required_reviewers" and (.reviewers | length) > 0)' >/dev/null
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Log in with the federated registry publisher identity
        run: az acr login --name "$REGISTRY" --output none
      - uses: docker/setup-buildx-action@v4
      - name: Build and publish immutable release
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ vars.AZURE_ACR_NAME }}.azurecr.io/${{ matrix.image }}:${{ github.sha }}
      - name: Record digest for the reviewed Terraform configuration
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '`%s.azurecr.io/%s@%s`\n' "$REGISTRY" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-backend:
    name: Verify backend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x backend/gradlew

      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test --console=plain

      - name: Run real broker and storage integration test
        working-directory: backend
        run: ./gradlew externalIntegrationTest --console=plain

  verify-frontend:
    name: Verify frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  verify-product-golden-path:
    name: Verify product golden path
    needs:
      - verify-backend
      - verify-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium for the browser test
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build release containers
        run: docker compose --profile app build api worker frontend

      - name: Verify image safety and release files
        shell: bash
        run: |
          test "$(docker image inspect sluice-api:local --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect sluice-worker:local --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect sluice-frontend:local --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect sluice-api:local --format '{{json .Config.Healthcheck.Test}}')" != "null"
          test "$(docker image inspect sluice-worker:local --format '{{json .Config.Healthcheck.Test}}')" != "null"
          test "$(docker image inspect sluice-frontend:local --format '{{json .Config.Healthcheck.Test}}')" != "null"
          docker image inspect sluice-worker:local --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep --fixed-strings --line-regexp 'SPRING_FLYWAY_ENABLED=false'
          test "$(docker image inspect sluice-worker:local --format '{{json .Config.ExposedPorts}}')" = "null"
          docker run --rm --entrypoint bash sluice-api:local -c \
            'test -f /licenses/LICENSE && test -f /licenses/THIRD_PARTY_NOTICES.md'
          docker run --rm --entrypoint sh sluice-frontend:local -c \
            'test -f /licenses/LICENSE && test -f /licenses/THIRD_PARTY_NOTICES.md && test -f /licenses/THIRD_PARTY_LICENSES.txt'

      - name: Start and verify the release containers
        shell: bash
        run: |
          docker compose --profile app up -d --no-build --wait frontend worker
          for service in azurite api worker frontend; do
            container_id="$(docker compose ps -q "$service")"
            test -n "$container_id"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container_id")" = "healthy"
          done
          docker compose exec -T worker bash -c \
            'if exec 3<>/dev/tcp/127.0.0.1/8080 2>/dev/null; then echo "worker unexpectedly listens on HTTP port 8080" >&2; exit 1; fi'

      - name: Run browser golden path
        working-directory: frontend
        run: npm run test:e2e

      - name: Run API-first smoke path
        shell: pwsh
        run: ./scripts/demo-local.ps1

      - name: Stop the local product stack
        if: always()
        shell: bash
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            docker compose --profile app logs --no-color --tail 100 \
              postgres rabbitmq azurite api worker frontend || true
          fi
          docker compose --profile app down -v

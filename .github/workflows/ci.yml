name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify backend and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Make Gradle wrapper executable
        run: chmod +x backend/gradlew

      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test --console=plain

      - name: Run real broker and storage integration test
        working-directory: backend
        run: ./gradlew externalIntegrationTest --console=plain

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Chromium for the browser test
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the local product stack
        shell: bash
        run: |
          docker compose up -d --wait postgres rabbitmq azurite
          (cd backend && ./gradlew bootRun --console=plain > ../backend-ci.log 2>&1) &
          echo $! > backend-ci.pid
          (cd frontend && npm run start > ../frontend-ci.log 2>&1) &
          echo $! > frontend-ci.pid
          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:8080/actuator/health >/dev/null \
              && curl --fail --silent http://localhost:3000/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 80 backend-ci.log || true
          tail -n 80 frontend-ci.log || true
          exit 1

      - name: Run browser golden path
        working-directory: frontend
        run: npm run test:e2e

      - name: Run API-first smoke path
        shell: pwsh
        run: ./scripts/demo-local.ps1

      - name: Stop the local product stack
        if: always()
        shell: bash
        run: |
          if [ -f frontend-ci.pid ]; then kill "$(cat frontend-ci.pid)" || true; fi
          if [ -f backend-ci.pid ]; then kill "$(cat backend-ci.pid)" || true; fi
          if [ "${{ job.status }}" != "success" ]; then
            tail -n 80 backend-ci.log || true
            tail -n 80 frontend-ci.log || true
          fi
          docker compose down -v

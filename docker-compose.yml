version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: sluice-postgres
    environment:
      POSTGRES_USER: sluice
      POSTGRES_PASSWORD: sluice_password
      POSTGRES_DB: sluice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sluice -d sluice"]
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: sluice-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/workspace

volumes:
  postgres_data:
  azurite_data:
